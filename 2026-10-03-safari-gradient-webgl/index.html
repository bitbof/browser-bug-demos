<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas gradient → WebGL → Canvas 2D</title>
<style>
    body { font: 16px sans-serif; margin: 24px; }
    .canvases { display: flex; flex-wrap: wrap; gap: 16px; }
    figure { margin: 0; }
    canvas { display: block; background: var(--background, #000000); max-width: 100%; }
    figcaption { margin-bottom: 8px; }
</style>
<h1>Canvas gradient → WebGL → Canvas 2D</h1>
<p>A color-to-transparent Canvas 2D gradient uploaded with texImage2D and drawn by
    a WebGL shader, then copied back to Canvas 2D with drawImage.
    All three canvases should look alike. The background is only the backdrop.</p>
<p>
    <label>Context <select id="version">
        <option value="1">WebGL 1</option>
        <option value="2">WebGL 2</option>
    </select></label>
    <label>Gradient color <input id="color" type="color" value="#ff0000"></label>
    <label>Background color <input id="background" type="color" value="#000000"></label>
</p>
<div class="canvases">
    <figure><figcaption>Original Canvas 2D</figcaption><canvas id="source" width="512" height="512"></canvas></figure>
    <figure><figcaption>WebGL copy</figcaption><canvas id="webgl" width="512" height="512"></canvas></figure>
    <figure><figcaption>WebGL copied to Canvas 2D</figcaption><canvas id="result" width="512" height="512"></canvas></figure>
</div>
<pre id="status"></pre>
<script>
'use strict';

// Standalone reduction of Klecks's gradient and canvas-to-WebGL upload path.
const source = document.getElementById('source');
const webgl = document.getElementById('webgl');
const result = document.getElementById('result');
const status = document.getElementById('status');
const color = document.getElementById('color');
const background = document.getElementById('background');
const version = document.getElementById('version');
const params = new URLSearchParams(location.search);
version.value = params.get('webgl') === '2' ? '2' : '1';
for (const input of [color, background]) {
    const saved = params.get(input.id);
    if (saved && /^#[0-9a-f]{6}$/i.test(saved)) input.value = saved;
}
// A canvas cannot change context type once initialized, so start fresh on a switch.
version.addEventListener('change', () => {
    const url = new URL(location.href);
    url.searchParams.set('webgl', version.value);
    url.searchParams.set('color', color.value);
    url.searchParams.set('background', background.value);
    location.href = url.href;
});
const isWebgl2 = version.value === '2';
const contextName = isWebgl2 ? 'webgl2' : 'webgl';
const contextLabel = isWebgl2 ? 'WebGL 2' : 'WebGL 1';

try {
    const ctx = source.getContext('2d');
    const resultCtx = result.getContext('2d');

    // Same context option and default upload pixel-store settings as Klecks.
    const gl = webgl.getContext(contextName, { premultipliedAlpha: false });
    if (!gl) throw new Error(`${contextLabel} is unavailable.`);

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    function compile(type, code) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, code);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(shader));
        }
        return shader;
    }

    const precision = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT).precision
        ? 'highp' : 'mediump';
    const shaderHeader = isWebgl2 ? '#version 300 es\n' : '';
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, shaderHeader + `
        ${isWebgl2 ? 'in' : 'attribute'} vec2 vertex;
        ${isWebgl2 ? 'out' : 'varying'} vec2 texCoord;
        void main() {
            texCoord = vertex;
            gl_Position = vec4(vertex * 2.0 - 1.0, 0.0, 1.0);
        }
    `));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, shaderHeader + `
        precision ${precision} float;
        uniform sampler2D sourceTexture;
        ${isWebgl2 ? 'in' : 'varying'} vec2 texCoord;
        ${isWebgl2 ? 'out vec4 fragmentColor;' : ''}
        void main() {
            ${isWebgl2 ? 'fragmentColor' : 'gl_FragColor'} =
                ${isWebgl2 ? 'texture' : 'texture2D'}(sourceTexture, vec2(texCoord.x, 1.0 - texCoord.y));
        }
    `));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);
    gl.uniform1i(gl.getUniformLocation(program, 'sourceTexture'), 0);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 0, 1, 1, 0, 1, 1]), gl.STATIC_DRAW);
    const vertex = gl.getAttribLocation(program, 'vertex');
    gl.enableVertexAttribArray(vertex);
    gl.vertexAttribPointer(vertex, 2, gl.FLOAT, false, 0, 0);
    gl.viewport(0, 0, webgl.width, webgl.height);

    function render() {
        try {
            document.documentElement.style.setProperty('--background', background.value);
            ctx.clearRect(0, 0, source.width, source.height);
            const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 240);
            // Keep the same RGB at both stops; only alpha changes.
            gradient.addColorStop(0, color.value);
            gradient.addColorStop(1, color.value + '00');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, source.width, source.height);

            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            // Copy immediately, before the default WebGL drawing buffer is discarded.
            resultCtx.clearRect(0, 0, result.width, result.height);
            resultCtx.drawImage(webgl, 0, 0);

            const error = gl.getError();
            status.textContent = error === gl.NO_ERROR
                ? `${contextLabel}: no API error (0x0)`
                : `${contextLabel} error: 0x${error.toString(16)}`;
        } catch (error) {
            status.textContent = String(error);
            console.error(error);
        }
    }
    color.addEventListener('input', render);
    background.addEventListener('input', render);
    render();
} catch (error) {
    status.textContent = String(error);
    console.error(error);
}
</script>
</html>
